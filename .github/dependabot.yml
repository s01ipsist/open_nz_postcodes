version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to full semver tags and locked in
    # .github/workflows/actions.lock (Dependabot regenerates it in the same PR).
    # Let fresh releases settle before we pin to them.
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/scripts/koordinates"
    schedule:
      interval: "weekly"
