name: Actions lockfile

# Fails if a `uses:` is missing from .github/workflows/actions.lock, or a locked
# commit is no longer reachable from its ref upstream. Regenerate the lockfile
# with `gh actions-lock`; see https://gh.io/actions-lockfile.
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  schedule:
    # Weekly, to catch locked refs that move or vanish upstream between edits.
    - cron: "17 3 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify --no-interactive
